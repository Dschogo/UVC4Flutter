import org.jetbrains.kotlin.gradle.dsl.JvmTarget

group = "com.serenegiant.uvc_stream"
version = "1.0-SNAPSHOT"

buildscript {
    repositories {
        google()
        mavenCentral()
        mavenLocal()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:9.2.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.10")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://raw.github.com/saki4510t/libcommon/master/repository/' }
    }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

android {
    namespace = "com.serenegiant.uvc_stream"

    // StreamPack 3.2.1 requires compiling against API 37 or later.
    compileSdk = 37
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 26

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_TOOLCHAIN=clang",
                        "-DANDROID_ARM_MODE=arm",
                        "-DANDROID_STL=c++_static",
                        "-DANDROID_CPP_FEATURES=rtti exceptions"
                def flags = "-DANDROID_NDK"
                cFlags flags
                cppFlags flags
            }
        }

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
            version = "3.22.1"
        }
    }

    dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.8.0")
        implementation "androidx.core:core-ktx:1.18.0"
        implementation "androidx.appcompat:appcompat:1.7.1"
        implementation("com.serenegiant:common:10.3.1")

        // StreamPack (Maven Central, no patches). Version is pinned here.
        implementation "io.github.thibaultbee.streampack:streampack-core:3.2.1"
        implementation "io.github.thibaultbee.streampack:streampack-rtmp:3.2.1"
        implementation "io.github.thibaultbee.streampack:streampack-srt:3.2.1"

        implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}
